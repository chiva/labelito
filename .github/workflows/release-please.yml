name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # JSON for the open release PR (empty when there is none) — consumed by update-lock.
      pr: ${{ steps.release.outputs.pr }}
      # "true" only on the push that actually publishes a release — gates the docker job.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      # A GitHub App token, not GITHUB_TOKEN: GitHub starts no workflows for events made with
      # GITHUB_TOKEN, so the release PR it opened never got its required checks.
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps pyproject.toml's version but never regenerates uv.lock, so the lockfile's
  # own package entry drifts behind the release. Re-lock on the release PR branch so the version bump
  # and the lockfile land in the same PR (and the CI `lock` guard stays green on merge).
  update-lock:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest

    steps:
      # Pushing with the App token (not GITHUB_TOKEN) starts CI on the release PR's new head.
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv lock
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --staged --quiet || git commit -m "chore: sync uv.lock for release"
          git push

  # When release-please publishes a release, build and push the image in the SAME run, gated on
  # release_created; GITHUB_TOKEN's packages: write is enough for GHCR. metadata-action is fed the
  # release tag explicitly because this job runs on a push to `main`, where the ref carries no tag
  # to derive the version from.
  docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      # Keyless Sigstore signing: GitHub's OIDC token is the signing identity for both the
      # cosign signature and the build-provenance attestation (no long-lived key to store).
      id-token: write
      # Lets actions/attest-build-provenance record the signed attestation against the repo.
      attestations: write

    steps:
      # Build exactly the code that was tagged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          # Deploy-only: builds/signs the image, never pushes with git (unlike update-lock above).
          persist-credentials: false

      - name: Verify tag exists
        run: test -n "${{ needs.release-please.outputs.tag_name }}"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU emulates the arm64 build (Home Assistant / Raspberry Pi hosts). The icons stage is
      # pinned to $BUILDPLATFORM in the Dockerfile, so only the Python stages run emulated.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit's own (unsigned) in-toto attestations, embedded in the image index. The
          # signed, transparency-logged layers below are what `gh`/`cosign` actually verify.
          provenance: true
          sbom: true

      # Signed SLSA build provenance — binds the image digest to this workflow via Sigstore and
      # records it in the Rekor transparency log + GHCR. Verify with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # cosign keyless signature over the same digest — the signature format Kubernetes admission
      # controllers (Kyverno, sigstore policy-controller) verify. Reuses the GHCR login above.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless)
        env:
          IMAGE_DIGEST: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_DIGEST}"

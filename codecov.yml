# Codecov configuration. Without this file Codecov applies its defaults, and its default `project`
# status has no tolerance at all: PR #119, a dependency bump that touched no source file, failed
# with "94.84% (-0.16%) compared to c095834". A required check that goes red on rounding noise
# teaches everyone to ignore it, so the thresholds here are set deliberately.
#
# Coverage is already gated locally: [tool.coverage.report] in pyproject.toml sets fail_under = 85
# and CI runs `pytest --cov`, so a real collapse turns the Tests job red without involving a third
# party. What that floor CANNOT see is the diff — measured coverage is ~95%, so a PR can add a
# couple of hundred untested lines and still sit far above 85. That is the gap `patch` closes, and
# it is the reason this repo uploads to Codecov at all.
coverage:
  status:
    # Overall coverage. Blocks on a genuine regression, tolerates noise. 1% against a ~95% baseline
    # is roughly 40 statements of the 4054 measured.
    project:
      default:
        target: auto
        threshold: 1%
    # Coverage of the lines this PR changed. This is the check with something to say that
    # fail_under does not: new code arrives tested, whatever the aggregate looks like.
    patch:
      default:
        target: 80%
        threshold: 0%

# The matrix uploads one report per interpreter (flags python-3.13 and python-3.14) for the same
# source tree. Wait for both before deciding, so a status is never computed from a half-arrived
# picture and then left stale.
codecov:
  notify:
    after_n_builds: 2

comment:
  # Both uploads present before commenting, for the same reason.
  after_n_builds: 2
  require_changes: true

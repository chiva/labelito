[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "labelito"
version = "0.18.1"
description = "labelito — self-hosted Brother QL label print service with Home Assistant integration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
keywords = ["brother", "label", "printer", "home-assistant", "ql-810w"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "Pillow==12.3.0",
    "cairosvg==2.9.0",
    "qrcode[pil]==8.2",
    "python-barcode[images]==0.16.1",
    "brother_ql_next==0.12.0",
    "PyYAML==6.0.3",
    "Jinja2==3.1.6",
    "python-multipart==0.0.32",
    "prometheus-client==0.26.0",
    # 2.1.1 is the release whose server API this code targets: 2.x renamed FastMCP to MCPServer and
    # moved every transport setting off the constructor, so 1.x cannot run it. No ceiling — every
    # other dependency here is declared the same way, and a ceiling is the wrong tool for keeping a
    # major out of a lock refresh (see renovate.json: rangeStrategy "pin" is what does that).
    "mcp==2.1.1",
    # OAuth 2.0 Resource Server (OIDC) validation for the /mcp endpoint. PyJWT ships PyJWKClient,
    # which fetches an IdP's JWKS, caches signing keys by kid, and refetches on an unknown kid
    # (key rotation). The [crypto] extra pulls in `cryptography` for RS256/ES256 verification.
    "PyJWT[crypto]==2.13.0",
]

[project.urls]
Homepage = "https://github.com/chiva/labelito"
Issues = "https://github.com/chiva/labelito/issues"

[dependency-groups]
# httpx2 is the backend starlette.testclient is built for (TestClient does `import httpx2 as httpx`).
test = ["pytest==9.1.1", "pytest-cov==7.1.0", "pytest-asyncio==1.4.0", "httpx2==2.12.0"]
lint = ["ruff==0.16.5"]
typing = ["mypy==2.3.1", "types-PyYAML==6.0.12.20260815", "types-Pillow==10.2.0.20240822"]
license = ["pip-licenses==5.5.5"]
# End-to-end harness: drives a real uvicorn process with a real browser. Opt-in (the e2e suite is
# deselected by default via `-m "not e2e"`), and needs a one-time `uv run playwright install
# chromium` to download the browser. Used by both `pytest -m e2e` and scripts/dev-harness.py.
e2e = ["pytest-playwright==0.9.0"]
# Provenance tooling for scripts/build-brand-assets.py, which regenerates site/assets/brand/**.
# fonttools outlines the Inter wordmark to paths; uharfbuzz shapes the word (applying Inter's
# kerning so the outlines match the browser-rendered wordmark); brotli lets fonttools read the
# .woff2 source. cairosvg (the rasterizer) is already a core runtime dependency above.
brand-assets = ["fonttools==4.64.0", "uharfbuzz==0.56.1", "brotli==1.2.0"]
dev = [
    "pre-commit==4.6.2",
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "typing"},
    {include-group = "license"},
    {include-group = "e2e"},
    {include-group = "brand-assets"},
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
markers = [
    "hardware: requires physical Brother printer (deselect with -m 'not hardware')",
    "e2e: end-to-end tests driving a real server + browser; opt-in via --e2e (needs playwright)",
    "slow: slow tests",
    "icons: verifies bundled icon collections produced by scripts/fetch-icons.sh (fetch first)",
]
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
# usb.py stays omitted: its raw pyusb device I/O genuinely needs attached hardware (the mappable
# logic around it is exercised via patched backends in tests/test_transports.py). network.py is
# measured: its framing/deadline/error-mapping logic runs entirely against fake sockets.
omit = ["app/transports/usb.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
